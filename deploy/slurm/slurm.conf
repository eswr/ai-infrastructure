# Slurm lab configuration (phase 6): a two-node GPU partition with FAKE
# GRES resources. The vocabulary is the deliverable — partitions, GRES,
# drain/resume, priorities — not accelerators.
ClusterName=inference-lab
SlurmctldHost=slurmctl
AuthType=auth/munge
ProctrackType=proctrack/pgid
ReturnToService=2
SlurmctldPort=6817
SlurmdPort=6818
SrunPortRange=60000-61000
StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SwitchType=switch/none
MpiDefault=none
SlurmctldPidFile=/run/slurmctld.pid
SlurmdPidFile=/run/slurmd.pid
GresTypes=gpu
# Fake accelerators: each node exposes 2 A100s that exist only as scheduler
# resources (see gres.conf). The whole point: GPU-aware scheduling WITHOUT
# GPUs.
NodeName=node[01-02] CPUs=4 RealMemory=4096 Gres=gpu:a100:2 State=UNKNOWN
PartitionName=gpu Nodes=ALL Default=YES MaxTime=8:00:00 State=UP
PartitionName=batch Nodes=ALL Default=NO MaxTime=4:00:00 State=UP
# Minimalistic but honest scheduler behavior for the exercises:
SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core
PriorityType=priority/basic
SlurmUser=slurm
SlurmctldDebug=info
SlurmdDebug=info
