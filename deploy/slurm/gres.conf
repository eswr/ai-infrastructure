# Fake GPU resources: scheduler-visible A100s with no devices behind them.
# Slurm will happily allocate "GPU 0/1" per node; jobs that try to USE a
# real device would fail — these nodes exist to teach the scheduling
# vocabulary (sbatch --gres, squeue, drain/resume), not to compute.
# FAKE devices: Slurm 21.08's GRES plugin wants one existing device file
# per count and rejects duplicates, so two harmless character devices stand
# in for the A100s. They compute nothing; they are scheduler bookkeeping.
NodeName=node[01-02] Name=gpu Type=a100 Count=2 File=/dev/zero,/dev/random
