# Mock DCGM exporter (phase 6B): DCGM-shaped telemetry for the SIMULATED
# fleet. Every series carries simulation="true" — this is observability
# wiring, not GPU measurement. The exporter derives its inventory from the
# gateway /status (the control plane decides what exists), serves the
# DCGM_FI_* metric names a real dcgm-exporter would, and takes failure
# injections for the phase-6E exercises.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mock-dcgm-script
  namespace: inference-lab
data:
  mock_dcgm.py: |
__DCGM_SCRIPT__
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-dcgm
  namespace: inference-lab
  labels: {app: mock-dcgm}
spec:
  replicas: 1
  selector:
    matchLabels: {app: mock-dcgm}
  template:
    metadata:
      labels: {app: mock-dcgm, inference-lab.io/simulation: "true"}
    spec:
      containers:
        - name: exporter
          image: python:3.12-slim
          command: ["python3", "/dcgm/mock_dcgm.py"]
          env:
            - name: GATEWAY_URL
              value: http://gateway.inference-lab.svc.cluster.local
          ports:
            - containerPort: 9400
              name: metrics
          volumeMounts:
            - {name: script, mountPath: /dcgm}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 96Mi}
      volumes:
        - name: script
          configMap: {name: mock-dcgm-script}
---
apiVersion: v1
kind: Service
metadata:
  name: mock-dcgm
  namespace: inference-lab
spec:
  type: NodePort
  selector: {app: mock-dcgm}
  ports:
    - name: metrics
      port: 9400
      targetPort: metrics
      nodePort: 30081
