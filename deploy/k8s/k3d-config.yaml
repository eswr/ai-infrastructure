apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: inference-lab
servers: 1
agents: 0
# host :8080 -> loadbalancer -> nodePort 30080 -> gateway Service.
# localhost:8080/metrics then scrapes the IN-CLUSTER gateway (the
# observability compose stack already scrapes host.docker.internal:8080).
ports:
  - port: "8080:30080"
    nodeFilters:
      - loadbalancer
options:
  k3s:
    extraArgs:
      - arg: --disable=traefik
        nodeFilters:
          - server:*
