global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # OTLP metrics relayed by the collector (gateway/loadgen tracing exports).
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # Gateway runs natively on the Mac.
  - job_name: gateway
    static_configs:
      - targets: ["host.docker.internal:8080"]

  # Phase 6B: mock DCGM exporter for the SIMULATED GPU fleet (k3d nodePort
  # 30081 -> host 9400). Every series carries simulation="true".
  - job_name: dcgm-sim
    static_configs:
      - targets: ["host.docker.internal:9400"]

  # llama.cpp worker (native, exposes Prometheus metrics at /metrics).
  - job_name: llama-server
    static_configs:
      - targets: ["host.docker.internal:8081"]

  # MLX-LM worker (native). Enable when the worker exports metrics.
  # - job_name: mlx-lm
  #   static_configs:
  #     - targets: ["host.docker.internal:8082"]

  # vLLM-Metal worker (native).
  # - job_name: vllm-metal
  #   static_configs:
  #     - targets: ["host.docker.internal:8083"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
